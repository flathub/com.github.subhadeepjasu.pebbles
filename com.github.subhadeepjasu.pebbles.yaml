app-id: com.github.subhadeepjasu.pebbles
sdk: org.gnome.Sdk
runtime: org.gnome.Platform
runtime-version: '50'
base: io.elementary.BaseApp # elementary SDK is not available on Flathub, so use the elementary BaseApp instead
base-version: circe-25.08
command: com.github.subhadeepjasu.pebbles

finish-args:
  - --device=dri
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --metadata=X-DConf=migrate-path=/com/github/subhadeepjasu/pebbles

cleanup:
  - /lib/python3.*/site-packages/*/*/tests
  - /lib/python3.*/site-packages/*/tests

# WARNING: A temporary solution until io.elementary.BaseApp//circe-26.08 released
cleanup-commands:
  - rm -rf /app/bin/sassc
  - rm -rf /app/include
  - rm -rf /app/lib/pkgconfig
  - rm -rf /app/share/gir-1.0
  - rm -rf /app/share/man
  - rm -rf /app/share/vala

modules:
  - shared-modules/libsoup/libsoup-2.4.json
  - python-deps.yml

  - name: Pebbles
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    post-install:
      # workaround for non-png-icon-in-hicolor-size-folder lint error
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - mv /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - find /app/share/icons/hicolor -type f -not -path "*scalable*" -not -path "*actions*" -name "*.svg" -delete
    sources:
      - type: git
        url: https://github.com/SubhadeepJasu/pebbles.git
        tag: v3.0.0
        commit: b2b7b6f10ea3703e10c9f4c566c6892f220250eb
        x-checker-data:
          is-main-source: true
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: patches/blp-meson-temp.patch
