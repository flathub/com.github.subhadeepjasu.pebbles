app-id: com.github.subhadeepjasu.pebbles
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
base: io.elementary.BaseApp
base-version: circe-25.08
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
build-options:
  prepend-path: /usr/lib/sdk/vala/bin/
  prepend-ld-library-path: /usr/lib/sdk/vala/lib
command: com.github.subhadeepjasu.pebbles
finish-args:
  - --device=dri
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --system-talk-name=org.freedesktop.Accounts
  - --metadata=X-DConf=migrate-path=/com/github/subhadeepjasu/pebbles

cleanup:
  - '.la'
  - '*.a'
  - /cache
  - /include
  - /lib/pkgconfig
  - /lib/systemd
  - /lib/valadoc
  - /lib/valadoc-0.48
  - /man
  - /gls
  - /share/aclocal
  - /share/devhelp
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/man
  - /share/vala-0.40
  - /share/vala-0.48
  - /share/valadoc
  - /share/valadoc-0.48

modules:
  - shared-modules/libsoup/libsoup-2.4.json
  - python-deps.yml
  - name: libsass
    cleanup:
      - "*"
    sources:
      - type: archive
        url: https://github.com/sass/libsass/archive/3.5.4.tar.gz
        sha256: 5f61cbcddaf8e6ef7a725fcfa5d05297becd7843960f245197ebb655ff868770

      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -si

  - name: sassc
    cleanup:
      - "*"
    sources:
      - type: archive
        url: https://github.com/sass/sassc/archive/3.5.0.tar.gz
        sha256: 26f54e31924b83dd706bc77df5f8f5553a84d51365f0e3c566df8de027918042

      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -si

  - name: blueprint-compiler
    buildsystem: meson
    cleanup:
      - "*"
    sources:
      - type: git
        url: https://gitlab.gnome.org/jwestman/blueprint-compiler
        tag: v0.14.0


  - name: Pebbles
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/SubhadeepJasu/pebbles.git
        tag: v3.0.0
        commit: b2b7b6f10ea3703e10c9f4c566c6892f220250eb
    post-install:
      # workaround for non-png-icon-in-hicolor-size-folder lint error
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - mv /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - find /app/share/icons/hicolor -type f -not -path "*scalable*" -not -path "*actions*" -name "*.svg" -delete
